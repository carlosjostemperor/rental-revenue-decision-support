[project]
name = "rm-analytics"
version = "2.1.0"
description = "Auditable pricing-position analysis of PriceLabs exports"
requires-python = ">=3.10"
dependencies = ["pandas>=2.2,<4.0", "numpy>=1.26,<3.0", "matplotlib>=3.8,<4.0"]

[tool.setuptools]
packages = ["rm_analytics"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
